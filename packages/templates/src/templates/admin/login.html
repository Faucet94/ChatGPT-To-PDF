<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}} — Admin Login</title>
    <style>{{CSS}}</style>
  </head>
  <body>
    <div class="login-wrapper">
      <!-- Animated background particles -->
      <div class="particles">
        <div class="particle" style="--x: 10%; --y: 20%; --s: 3; --d: 0s;"></div>
        <div class="particle" style="--x: 30%; --y: 60%; --s: 2; --d: 1s;"></div>
        <div class="particle" style="--x: 50%; --y: 10%; --s: 4; --d: 0.5s;"></div>
        <div class="particle" style="--x: 70%; --y: 40%; --s: 2.5; --d: 2s;"></div>
        <div class="particle" style="--x: 85%; --y: 70%; --s: 3.5; --d: 3s;"></div>
        <div class="particle" style="--x: 15%; --y: 80%; --s: 2; --d: 1.5s;"></div>
        <div class="particle" style="--x: 60%; --y: 85%; --s: 3; --d: 2.5s;"></div>
        <div class="particle" style="--x: 90%; --y: 25%; --s: 2.5; --d: 0.8s;"></div>
        <div class="particle" style="--x: 40%; --y: 50%; --s: 2; --d: 3.5s;"></div>
        <div class="particle" style="--x: 75%; --y: 90%; --s: 3; --d: 4s;"></div>
      </div>

      <!-- Key & Lock Animation -->
      <div class="animation-container">
        <div class="lock-key-animation" id="lockKeyAnim">
          <!-- Lock body -->
          <svg class="lock-svg" viewBox="0 0 200 300" width="120" height="180">
            <!-- Lock shackle -->
            <path class="lock-shackle" d="M60 120 V80 A40 40 0 0 1 140 80 V120" fill="none" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round"/>
            <!-- Lock body with gradient -->
            <defs>
              <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#475569;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
              </linearGradient>
              <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
              </linearGradient>
            </defs>
            <rect class="lock-body" x="45" y="118" width="110" height="100" rx="16" fill="url(#lockGrad)" stroke="#334155" stroke-width="2"/>
            <!-- Keyhole -->
            <circle class="keyhole-outer" cx="100" cy="178" r="16" fill="#0f172a" stroke="#475569" stroke-width="2"/>
            <path class="keyhole-inner" d="M90 178 Q90 168 100 168 Q110 168 110 178 L104 192 Q104 196 100 196 Q96 196 96 192 Z" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
            <!-- Lock highlight (glow when key inserted) -->
            <circle class="keyhole-glow" cx="100" cy="178" r="18" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0"/>
            <!-- Lock shine -->
            <rect class="lock-shine" x="55" y="128" width="30" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
          </svg>
          <!-- Key -->
          <svg class="key-svg" viewBox="0 0 80 200" width="48" height="120">
            <!-- Key shaft -->
            <line class="key-shaft" x1="30" y1="180" x2="30" y2="40" stroke="url(#keyGrad)" stroke-width="8" stroke-linecap="round"/>
            <!-- Key bow (handle) -->
            <circle class="key-bow" cx="30" cy="25" r="18" fill="none" stroke="url(#keyGrad)" stroke-width="6"/>
            <circle class="key-bow-inner" cx="30" cy="25" r="8" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
            <!-- Key teeth -->
            <path class="key-teeth" d="M34 140 L50 140 L50 148 L34 148 M34 156 L56 156 L56 164 L34 164 M34 172 L46 172 L46 180 L34 180" stroke="url(#keyGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
            <!-- Key glow -->
            <circle class="key-glow" cx="30" cy="25" r="22" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0"/>
          </svg>
        </div>
        <p class="animation-label">{{ANIMATION_LABEL}}</p>
      </div>

      <!-- Login Card (Neumorphism) -->
      <div class="login-card">
        <div class="login-card-header">
          <div class="login-icon">🔐</div>
          <h1 class="login-title">Admin Dashboard</h1>
          <p class="login-subtitle">Acesso restrito</p>
        </div>

          <form class="login-form" id="loginForm" action="{{API_BASE}}/admin/login" method="POST">
            <!-- Honeypot: hidden field that bots fill, humans don't see -->
            <div style="position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden;">
              <label for="website_url">Não preencher</label>
              <input type="text" id="website_url" name="website_url" tabindex="-1" autocomplete="off" />
            </div>
            <!-- Anti-CSRF tokens -->
            <input type="hidden" name="_nonce" value="{{FORM_NONCE}}" />
            <input type="hidden" name="_hash" value="{{FORM_HASH}}" />

            <div class="form-group">
            <label class="form-label" for="username">Usuário</label>
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input
                type="text"
                id="username"
                name="username"
                class="form-input"
                placeholder="Digite seu usuário"
                required
                autocomplete="username"
                autofocus
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Senha</label>
            <div class="input-wrapper">
              <span class="input-icon">🔑</span>
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="Digite sua senha"
                required
                autocomplete="current-password"
              />
            </div>
          </div>

          <div class="form-error" id="loginError" style="display:none;">
            <span>⚠️</span>
            <span id="errorMessage">Credenciais inválidas</span>
          </div>

          <button type="submit" class="login-btn" id="loginBtn">
            <span class="btn-text" id="btnText">Entrar</span>
            <span class="btn-spinner" id="btnSpinner" style="display:none;"></span>
          </button>
        </form>

        <div class="login-footer">
          <p>🔒 Ambiente seguro • Sessão criptografada</p>
        </div>
      </div>
    </div>

    <script>
    const API_BASE = '{{API_BASE}}';

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const username = document.getElementById('username');
      const password = document.getElementById('password');
      const loginBtn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const loginError = document.getElementById('loginError');
      const errorMessage = document.getElementById('errorMessage');
      const keyAnim = document.getElementById('lockKeyAnim');

      // Trigger key animation on focus
      username.addEventListener('focus', () => {
        keyAnim.classList.add('key-approaching');
      });

      password.addEventListener('focus', () => {
        keyAnim.classList.add('key-inserting');
      });

      password.addEventListener('blur', () => {
        if (!document.querySelector('.form-error:not([style*="display: none"])')) {
          keyAnim.classList.remove('key-inserting');
          keyAnim.classList.remove('key-approaching');
        }
      });

      // Shake on error
      function showError(message) {
        errorMessage.textContent = message;
        loginError.style.display = 'flex';
        loginError.classList.add('shake');
        setTimeout(() => loginError.classList.remove('shake'), 500);
        keyAnim.classList.add('key-failed');
        setTimeout(() => keyAnim.classList.remove('key-failed'), 1000);
      }

      function hideError() {
        loginError.style.display = 'none';
      }

      // Form submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();

        const user = username.value.trim();
        const pass = password.value.trim();

        if (!user || !pass) {
          showError('Preencha todos os campos');
          return;
        }

        // Disable button and show spinner
        loginBtn.disabled = true;
        btnText.textContent = 'Autenticando...';
        btnSpinner.style.display = 'inline-block';
        keyAnim.classList.add('key-inserting');

        try {
          // Use FormData to include honeypot and anti-CSRF tokens
          const formData = new FormData(form);

          const response = await fetch(`${API_BASE}/admin/login`, {
            method: 'POST',
            body: formData,
          });

          const data = await response.json();

          if (response.ok && data.token) {
            // Success!
            keyAnim.classList.add('key-unlocked');
            btnText.textContent = '✅ Autenticado!';

            // Store token and redirect
            localStorage.setItem('admin_token', data.token);
            setTimeout(() => {
              window.location.href = '/admin';
            }, 800);
          } else {
            showError(data.error || 'Credenciais inválidas');
            loginBtn.disabled = false;
            btnText.textContent = 'Entrar';
            btnSpinner.style.display = 'none';
            keyAnim.classList.remove('key-inserting');
          }
        } catch (err) {
          showError('Erro de conexão com o servidor');
          loginBtn.disabled = false;
          btnText.textContent = 'Entrar';
          btnSpinner.style.display = 'none';
          keyAnim.classList.remove('key-inserting');
        }
      });
    });
    </script>
  </body>
</html>
